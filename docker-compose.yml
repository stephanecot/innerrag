services:
  innerrag:
    build:
      context: .
      target: cpu
    image: innerrag:latest
    ports:
      # No authentication: only this machine can reach the server. Use "8080:8080" on a trusted network.
      - "127.0.0.1:8080:8080"
    volumes:
      # All projects and the call history.
      - ./data:/data
      # A project shared through git can be mounted on its own, for example:
      # - ./mon-depot/.innerrag:/data/projects/mon-projet
      # Folders a project can follow (Projets page > Dossier surveillé), read-only:
      # - ./mon-depot/docs:/watch/mon-depot-docs:ro
    environment:
      INNERRAG_USER: ${INNERRAG_USER:-local}
      # INNERRAG_DEFAULT_STATUS: DRAFT
      # INNERRAG_NER_LABELS: person,organization,location,event,product,technology
    restart: unless-stopped

  # Development: the server runs from ./src and is rebuilt and restarted on every change (cargo watch).
  #   docker compose --profile dev up -d innerrag-dev      (first start: a few minutes of compilation)
  #   docker compose logs -f innerrag-dev                  (compilation and server logs)
  #   cd ui && npm run dev                                 (UI with hot reload on http://localhost:5173)
  # It uses ./data like the image: stop the `innerrag` service first, a database opens in one process only.
  innerrag-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: innerrag:dev
    ports:
      # The port Vite's proxy and the chat bridge look for in development.
      - "127.0.0.1:18080:8080"
    volumes:
      - .:/src
      - ./data:/data
      # Build cache in volumes: fast, and kept across restarts.
      - cargo-target:/cargo-target
      - cargo-registry:/usr/local/cargo/registry
      # - ./mon-depot/docs:/watch/mon-depot-docs:ro
    environment:
      INNERRAG_USER: ${INNERRAG_USER:-local}

  # NVIDIA GPU variant: docker compose --profile gpu up -d innerrag-gpu
  # (needs the NVIDIA Container Toolkit on a Linux or Windows/WSL2 host; not available on macOS)
  innerrag-gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: runtime-cuda
      platforms: ["linux/amd64"]
    image: innerrag:cuda
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      INNERRAG_USER: ${INNERRAG_USER:-local}
      INNERRAG_DEVICE: auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  cargo-target:
  cargo-registry:
