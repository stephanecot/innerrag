[package]
name = "innerrag"
version = "0.1.0"
edition = "2021"
description = "Graph RAG server on LadybugDB with embedded local models"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
gline-rs = "1.1"
lbug = "=0.21.2"
ndarray = "0.16"
# Pinned to the version gline-rs uses; load-dynamic loads libonnxruntime.so at runtime
# instead of statically linking it next to liblbug.
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "load-dynamic"] }
orp = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
base64 = "0.23"
rust-stemmers = "1.2.0"

[profile.release]
lto = "thin"
codegen-units = 4
